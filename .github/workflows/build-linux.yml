name: Build Linux AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # the oldest supported Ubuntu: the app needs the glibc it was built against or newer,
    # so building here lets it run on Ubuntu 22.04+, Debian 12+, Fedora 36+, Mint 21+
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to attach the AppImage to a GitHub Release on tags
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          # Tesseract (bundled with the app), patchelf for bundling it, libxcb-cursor0 (the
          # spec bundles it), and the libraries Qt needs to start in CI
          sudo apt-get install -y --no-install-recommends tesseract-ocr patchelf libxcb-cursor0 \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bundle Tesseract OCR
        run: |
          installer/linux/bundle-tesseract.sh
          echo "KHMERPDF_TESSERACT=$PWD/build-deps/tesseract/tesseract" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Version
        id: ver
        run: echo "version=$(python -c 'import khmerpdf; print(khmerpdf.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm khmerpdf.spec

      - name: Smoke-test the frozen app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # still running after 8 s (timeout's exit code 124) means it started fine
          set +e; timeout 8 dist/KhmerPDF/KhmerPDF; code=$?; set -e
          if [ "$code" -ne 124 ]; then echo "KhmerPDF exited early with code $code"; exit 1; fi

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE on the runner
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL=$PWD/appimagetool installer/linux/build-appimage.sh ${{ steps.ver.outputs.version }}

      - name: Build .deb, and test-install it
        run: |
          installer/linux/build-deb.sh ${{ steps.ver.outputs.version }}
          sudo apt-get install -y ./dist/khmerpdf_*_amd64.deb
          set +e; QT_QPA_PLATFORM=offscreen timeout 8 khmerpdf; code=$?; set -e
          if [ "$code" -ne 124 ]; then echo "installed khmerpdf exited early with code $code"; exit 1; fi
          sudo apt-get remove -y khmerpdf

      # Only for runs started by hand (Actions > Run workflow): pushes and PRs just check the
      # build, and tagged versions are kept on the Releases page. Artifacts count against the
      # account's storage quota (shared by every repo), so a full quota must not fail the build.
      - name: Keep the build as an artifact
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: KhmerPDF-${{ steps.ver.outputs.version }}-linux
          retention-days: 3
          path: |
            dist/KhmerPDF-*.AppImage
            dist/KhmerPDF-*-linux-x86_64.tar.gz
            dist/khmerpdf_*_amd64.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/KhmerPDF-*.AppImage
            dist/KhmerPDF-*-linux-x86_64.tar.gz
            dist/khmerpdf_*_amd64.deb
