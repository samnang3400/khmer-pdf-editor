name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the installer to a GitHub Release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import khmerpdf; print(khmerpdf.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm khmerpdf.spec

      - name: Smoke-test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\KhmerPDF\KhmerPDF.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "KhmerPDF.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\khmerpdf.iss

      - uses: actions/upload-artifact@v4
        with:
          name: KhmerPDF-Setup-${{ steps.ver.outputs.version }}
          path: dist/KhmerPDF-Setup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KhmerPDF-Setup-*.exe
