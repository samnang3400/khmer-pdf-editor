name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the installer to a GitHub Release on tags
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Tesseract OCR (bundled with the app)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "$env:ProgramFiles\Tesseract-OCR"
          New-Item -ItemType Directory -Force build-deps\tesseract | Out-Null
          # the program and its libraries; language data comes from khmerpdf/tessdata
          Copy-Item "$src\tesseract.exe", "$src\*.dll" build-deps\tesseract
          "KHMERPDF_TESSERACT=$PWD\build-deps\tesseract\tesseract.exe" | Out-File -Append $env:GITHUB_ENV

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import khmerpdf; print(khmerpdf.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm khmerpdf.spec

      - name: Smoke-test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\KhmerPDF\KhmerPDF.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "KhmerPDF.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\khmerpdf.iss

      # Only for runs started by hand (Actions > Run workflow): pushes and PRs just check the
      # build, and tagged versions are kept on the Releases page. Artifacts count against the
      # account's storage quota (shared by every repo), so a full quota must not fail the build.
      - name: Keep the installer as an artifact
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: KhmerPDF-Setup-${{ steps.ver.outputs.version }}
          retention-days: 3
          path: dist/KhmerPDF-Setup-*.exe

      # The app's updater checks the downloaded installer against this before running it
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\KhmerPDF-Setup-*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii dist\SHA256SUMS-windows.txt
          Get-Content dist\SHA256SUMS-windows.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/KhmerPDF-Setup-*.exe
            dist/SHA256SUMS-windows.txt
